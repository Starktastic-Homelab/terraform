name: Terraform apply

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
  workflow_dispatch:

env:
  KUBECONFIG: /tmp/kubeconfig
  KUBECTL_KUBERC: "false"

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      apply_mode: ${{ steps.check.outputs.apply_mode }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          SHOULD_RUN="false"
          APPLY_MODE="normal"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "✅ Manual dispatch detected."
            SHOULD_RUN="true"
            APPLY_MODE="normal"

          elif [[ "$PR_MERGED" == "true" ]]; then
            COMMIT_MSG=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json commits \
              --jq '.commits[-1].messageHeadline + " " + .commits[-1].messageBody')
            FULL_TEXT="$PR_TITLE $PR_BODY $COMMIT_MSG"

            # Patterns based on https://docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs
            if echo "$FULL_TEXT" | grep -iqE "\[(skip ci|ci skip|no ci|skip actions|actions skip)\]"; then
              echo "⛔ Skip pattern detected in PR title or body."
              SHOULD_RUN="false"
            else
              echo "✅ PR Merged and no skip patterns found."
              SHOULD_RUN="true"
            fi

            # Parse PR body checkboxes for apply mode
            DRAIN=$(echo "$PR_BODY" | grep -c '\- \[x\] Drain cluster nodes before apply' || true)
            DESTROY=$(echo "$PR_BODY" | grep -c '\- \[x\] Destroy and recreate infrastructure before apply' || true)
            CONFIRM=$(echo "$PR_BODY" | grep -c '\- \[x\] I confirm the destructive action selected above' || true)

            if [[ "$DRAIN" -gt 0 && "$DESTROY" -gt 0 ]]; then
              echo "❌ Cannot select both drain and destroy. These are mutually exclusive."
              exit 1
            fi

            if [[ "$DESTROY" -gt 0 ]]; then
              if [[ "$CONFIRM" -eq 0 ]]; then
                echo "❌ Destroy requires confirmation checkbox."
                exit 1
              fi
              echo "💣 Destroy mode selected and confirmed."
              APPLY_MODE="destroy"
            elif [[ "$DRAIN" -gt 0 ]]; then
              if [[ "$CONFIRM" -eq 0 ]]; then
                echo "❌ Drain requires confirmation checkbox."
                exit 1
              fi
              echo "🔄 Drain mode selected and confirmed."
              APPLY_MODE="drain"
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "apply_mode=$APPLY_MODE" >> $GITHUB_OUTPUT

  download-plan:
    name: Download Terraform plan and exitcode from S3
    needs: check-conditions
    if: |
      needs.check-conditions.outputs.should_run == 'true'
        && needs.check-conditions.outputs.apply_mode != 'destroy'
        && github.event_name == 'pull_request_target'
    runs-on: self-hosted
    container:
      image: amazon/aws-cli:latest
    steps:
      # Checkout falls back to a compressed archive because this image has no Git.
      - name: Install checkout archive tools
        run: dnf install -y tar gzip

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Terraform plan and exitcode from S3
        uses: ./.github/actions/s3-cp
        with:
          aws_access_key_id: ${{ secrets.S3_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_SECRET_KEY }}
          aws_endpoint_url: ${{ secrets.S3_ENDPOINT }}
          source: |
            s3://${{ secrets.S3_TF_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }}/
          destination: .
          recursive: 'true'

      - name: Upload Terraform plan and exitcode artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            plan.tfplan
            plan.exitcode

  apply:
    name: Locked drain, apply and recovery
    needs: [check-conditions, download-plan]
    if: >-
      !cancelled() && needs.check-conditions.outputs.should_run == 'true'
      && (needs.download-plan.result == 'success'
      || (needs.download-plan.result == 'skipped'
      && (needs.check-conditions.outputs.apply_mode == 'destroy' || github.event_name == 'workflow_dispatch')))
    runs-on: self-hosted
    container:
      image: python:trixie
      volumes:
        - /var/lib/homelab-maintenance:/maintenance
    outputs:
      has_changes: ${{ steps.apply.outputs.has_changes }}
    env:
      HOMELAB_RUNNER_INSTANCE: cc1aeeb7-4827-466c-9d4b-5dc6c881f193
      MAINTENANCE_OWNER: ${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}
      PYTHONPATH: ${{ github.workspace }}/maintenance-helper/scripts
      APPLY_MODE: ${{ needs.check-conditions.outputs.apply_mode }}
      EVENT_NAME: ${{ github.event_name }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN_ID: ${{ secrets.PM_API_TOKEN_ID }}
      PM_API_TOKEN_SECRET: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_ssh_pub_key: ${{ vars.TF_VAR_SSH_PUB_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout reviewed maintenance helper
        uses: actions/checkout@v7
        with:
          repository: Starktastic-Homelab/ansible
          ref: 887269798650e88fed791bb4f22a47bf50ad17be
          path: maintenance-helper
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Download Terraform plan artifact
        if: env.APPLY_MODE != 'destroy' && github.event_name == 'pull_request_target'
        uses: actions/download-artifact@v8
        with:
          name: tfplan

      - name: Prepare reviewed image and private kubeconfig
        env:
          KUBECONFIG_RAW: ${{ secrets.KUBECONFIG_RAW }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          name = json.loads(Path('packer-manifest.json').read_text())['builds'][0]['custom_data']['vm_name']
          if not name or '\n' in name or '\r' in name:
              raise ValueError('Invalid image name')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('TF_VAR_base_vm_name=' + name + '\n')
          fd = os.open(os.environ['KUBECONFIG'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as stream:
              stream.write(os.environ['KUBECONFIG_RAW'])
          PYTHON

      - name: Acquire ownership and execute infrastructure operation
        id: apply
        run: |
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$APPLY_MODE" != destroy ]; then
            python3 scripts/maintenance_apply.py --mode "$APPLY_MODE" --saved-plan
          else
            python3 scripts/maintenance_apply.py --mode "$APPLY_MODE"
          fi

  trigger-ansible:
    name: Trigger Ansible after successful lock release
    needs: [check-conditions, apply]
    if: >-
      !cancelled() && needs.apply.result == 'success'
      && needs.apply.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ansible Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          repository: Starktastic-Homelab/ansible
          event-type: infrastructure-changed

  cleanup:
    name: Cleanup after apply
    needs: [check-conditions, apply, trigger-ansible]
    if: |
      !cancelled() && needs.apply.result == 'success'
        && needs.check-conditions.outputs.should_run == 'true'
        && needs.check-conditions.outputs.apply_mode != 'destroy'
        && github.event_name == 'pull_request_target'
    runs-on: self-hosted
    container:
      image: amazon/aws-cli:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
    steps:
      - name: Remove Terraform plan & exitcode files from S3
        run: aws s3 rm s3://${{ secrets.S3_TF_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }} --recursive --quiet
