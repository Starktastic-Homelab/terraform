name: Drift detection

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check for drift
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: hashicorp/terraform:latest
    env:
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN_ID: ${{ secrets.PM_API_TOKEN_ID }}
      PM_API_TOKEN_SECRET: ${{ secrets.PM_API_TOKEN_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift == 'true' || steps.storage-plan.outputs.drift == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # By name, not position: the manifest also carries the storage image (packer build.yml reads it the same way).
      - name: Read manifest file
        run: |
          apk add --no-cache jq
          name="$(jq -er '[.builds[] | select(.name=="k3s")] | last | .custom_data.vm_name' packer-manifest.json)"
          echo "TF_VAR_base_vm_name=$name" >> "$GITHUB_ENV"

      - name: Init
        run: terraform init

      - name: Check for drift
        id: plan
        env:
          TF_VAR_ssh_pub_key: ${{ vars.TF_VAR_SSH_PUB_KEY }}
        run: |
          set +e
          # -detailed-exitcode: 0=Succeeded, 1=Error, 2=Succeeded with diff (drift)
          terraform plan -detailed-exitcode -no-color > drift.log
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 2 ]; then
            echo "⚠️ Drift detected!"
            echo "drift=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No drift."
            echo "drift=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Terraform error"
            exit 1
          fi

          base64 drift.log > drift.log.b64

      - name: Check the storage root for drift
        id: storage-plan
        env:
          TF_VAR_ssh_pub_key: ${{ vars.TF_VAR_SSH_PUB_KEY }}
        run: |
          if [ ! -f storage/terraform.tfvars ]; then
            echo "storage root has no terraform.tfvars: not checked"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apk add --no-cache python3 jq
          . scripts/bpg_env.sh
          . scripts/storage_template_env.sh
          terraform -chdir=storage init -input=false

          set +e
          terraform -chdir=storage plan -detailed-exitcode -no-color -input=false > storage/drift.log
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 2 ]; then
            echo "⚠️ Storage root drift detected!"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            printf '\n## storage root\n\n' >> drift.log
            cat storage/drift.log >> drift.log
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No storage root drift."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            cat storage/drift.log
            echo "❌ Terraform error in the storage root"
            exit 1
          fi

          base64 drift.log > drift.log.b64

      - name: Publish job summary
        if: always()
        run: |
          echo "### 🌍 Terraform Status" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.plan.outputs.drift == 'true' || steps.storage-plan.outputs.drift == 'true' }}" == "true" ]; then
             echo "⚠️ **Drift detected**" >> $GITHUB_STEP_SUMMARY
          else
             echo "✅ **Infrastructure matches configuration**" >> $GITHUB_STEP_SUMMARY
          fi

          echo '' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Show Plan Output</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```HCL' >> $GITHUB_STEP_SUMMARY
          cat drift.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

      - name: Upload drift log
        if: steps.plan.outputs.drift == 'true' || steps.storage-plan.outputs.drift == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: drift-log
          path: drift.log.b64
          retention-days: 1

  report:
    name: Handle drift issue
    needs: check
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download log
        if: needs.check.outputs.drift_detected == 'true'
        uses: actions/download-artifact@v8
        with:
          name: drift-log

      - name: Decode drift log and create issue body
        if: needs.check.outputs.drift_detected == 'true'
        run: |
          cat <<EOF > issue_body.md
          Infrastructure drift was detected during the scheduled check.

          <details><summary>Plan Output</summary>

          \`\`\`HCL
          $(base64 -d drift.log.b64)
          \`\`\`

          </details>

          Please review and either:
          1. Apply the changes (if the drift is valid updates made externally).
          2. Revert the external changes (if this was accidental).
          EOF

      - name: Create issue
        env:
          DRIFT_DETECTED: ${{ needs.check.outputs.drift_detected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "drift" --color "d73a4a" --description "Infrastructure drift detected" || true
          EXISTING_ISSUE=$(gh issue list --state open --label "drift" --json number --jq '.[0].number')

          if [ "$DRIFT_DETECTED" == "true" ]; then
            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create \
                --title "⚠️ Terraform drift detected: $(date +'%Y-%m-%d')" \
                --body-file issue_body.md --label 'drift'
            else
              echo "Drift issue #$EXISTING_ISSUE already exists. Updating..."
              gh issue comment "$EXISTING_ISSUE" --body "⚠️ **Drift persists** as of $(date +'%Y-%m-%d'). [See latest run artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi
          else
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Drift resolved. Closing issue #$EXISTING_ISSUE..."
              gh issue comment "$EXISTING_ISSUE" --body "✅ **Resolved:** No drift detected in the latest run. Closing issue."
              gh issue close "$EXISTING_ISSUE"
            else
              echo "System clean and no open issues. Nothing to do."
            fi
          fi
