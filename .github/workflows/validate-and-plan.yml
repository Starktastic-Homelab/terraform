name: Validate and plan Terraform template

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'renovate.json'

jobs:
  maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Starktastic-Homelab/ansible
          ref: main
          path: maintenance-helper
          persist-credentials: false
      - run: pip install PyYAML
      - run: python3 scripts/tests/test-maintenance-workflow.py
        env:
          PYTHONPATH: ${{ github.workspace }}/maintenance-helper/scripts
      - run: python3 scripts/tests/test-storage-ci.py
      - run: python3 scripts/tests/test-clone-source.py

  rebuild-policy-tests:
    name: Offline cluster rebuild policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: 'v1.17.2'
          terraform_wrapper: false
      - run: python3 scripts/tests/test-rebuild-cohort.py
      - run: python3 scripts/tests/test-storage-root.py
      - run: python3 scripts/tests/test-check-clone-source.py

  validate-and-plan:
    name: Terraform validate and plan
    # Job-scoped, not workflow-wide: the other PR jobs (and their third-party actions) need no Proxmox token.
    env:
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN_ID: ${{ secrets.PM_API_TOKEN_ID }}
      PM_API_TOKEN_SECRET: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_ssh_pub_key: ${{ vars.TF_VAR_SSH_PUB_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Terraform template
        env:
          TF_VAR_base_vm_name: 'base_vm_name'
        run: |
          terraform init
          terraform validate

      - name: Read manifest file
        run: |
          echo 'manifest<<EOF' >> $GITHUB_ENV
          cat packer-manifest.json >> $GITHUB_ENV
          echo -e '\nEOF' >> $GITHUB_ENV

      - name: Create Terraform plan
        env:
          TF_VAR_base_vm_name: ${{ fromJSON(env.manifest).builds[0].custom_data.vm_name }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out='plan.tfplan' > plan.log
          EXIT_CODE=$?
          set -e

          cat plan.log

          echo "$EXIT_CODE" > plan.exitcode
          base64 plan.log > plan.log.b64

          if [ $EXIT_CODE -eq 1 ]; then
            echo "❌ Terraform Plan failed with error."
            exit 1
          fi

          # The wwn guard warns in the PR comment before merge; scripts/maintenance_apply.py is the hard stop.
          # Only VM addresses are printed; the plan JSON never leaves this step.
          apk add --no-cache python3
          terraform show -json plan.tfplan | python3 scripts/csi_wwn_guard.py | tee -a plan.log
          base64 plan.log > plan.log.b64

          echo "✅ Plan generated with Exit Code: $EXIT_CODE"

      # A PR changes one root only (D25). python3 for bpg_env.sh comes from the step above.
      - name: Create storage root plan
        id: storage-plan
        run: |
          . scripts/bpg_env.sh
          terraform -chdir=storage init -input=false
          terraform -chdir=storage validate

          if [ ! -f storage/terraform.tfvars ]; then
            echo 'storage root has no terraform.tfvars: not planned' | tee -a plan.log
            base64 plan.log > plan.log.b64
            echo 'planned=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          terraform -chdir=storage plan -no-color -input=false -detailed-exitcode -out=plan.tfplan > storage/plan.log
          EXIT_CODE=$?
          set -e

          cat storage/plan.log
          echo "$EXIT_CODE" > storage/plan.exitcode
          printf '\n## storage root\n\n' >> plan.log
          cat storage/plan.log >> plan.log
          base64 plan.log > plan.log.b64
          echo 'planned=true' >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "❌ Storage root plan failed with error."
            exit 1
          fi
          if [ "$EXIT_CODE" -eq 2 ] && [ "$(cat plan.exitcode)" = 2 ]; then
            echo "❌ This PR changes both the k3s root and the storage root; split it into one PR per root."
            exit 1
          fi

      # The saved plan holds prior state, so it goes straight to S3: an artifact
      # of this public repo is downloadable by anyone.
      - name: Install AWS CLI and bash for the local S3 composite action
        run: apk add --no-cache aws-cli bash

      # apply.yml applies whatever sits under pr-<n>/storage/, so a plan from an earlier push must not outlive this one.
      - name: Remove stale storage root plan from S3
        if: steps.storage-plan.outputs.planned == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
          AWS_REGION: us-east-1
          STORAGE_PLAN_PREFIX: s3://${{ secrets.S3_TF_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }}/storage/
        run: aws s3 rm "$STORAGE_PLAN_PREFIX" --recursive --quiet

      - name: Upload Terraform plan and exitcode to S3
        uses: ./.github/actions/s3-cp
        with:
          aws_access_key_id: ${{ secrets.S3_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_SECRET_KEY }}
          aws_endpoint_url: ${{ secrets.S3_ENDPOINT }}
          source: |
            plan.tfplan
            plan.exitcode
          destination: s3://${{ secrets.S3_TF_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }}/

      - name: Upload storage root plan and exitcode to S3
        if: steps.storage-plan.outputs.planned == 'true'
        uses: ./.github/actions/s3-cp
        with:
          aws_access_key_id: ${{ secrets.S3_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_SECRET_KEY }}
          aws_endpoint_url: ${{ secrets.S3_ENDPOINT }}
          source: |
            storage/plan.tfplan
            storage/plan.exitcode
          destination: s3://${{ secrets.S3_TF_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }}/storage/

      - name: Upload plan log artifact
        uses: actions/upload-artifact@v7
        with:
          name: planlog
          path: plan.log.b64

      - name: Remove saved plan from the runner workspace
        if: always()
        run: rm -f plan.tfplan plan.exitcode plan.log plan.log.b64 storage/plan.tfplan storage/plan.exitcode storage/plan.log

  comment:
    name: Comment plan in Pull Request
    runs-on: ubuntu-latest
    needs: validate-and-plan
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Terraform plan log artifact
        uses: actions/download-artifact@v8
        with:
          name: planlog

      - name: Decode plan log
        run: |
          base64 -d plan.log.b64 > plan.log
          PLAN=$(cat plan.log)
          echo "PLAN<<EOF" >> $GITHUB_ENV
          echo "$PLAN" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: terraform-plan
          message: |
            ## Terraform Plan 📖
            <details>
            <summary>Click to expand</summary>

            ```HCL
            ${{ env.PLAN }}
            ```

            </details>

            *Pusher: @${{ github.actor }}, Action: `${{ github.event_name }}`*
